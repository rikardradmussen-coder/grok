name: Automated Store Builds

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  android:
    name: Android EAS → Play Internal
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - name: Require Expo token
        run: |
          if [ -z "${{ secrets.EXPO_TOKEN }}" ]; then
            echo "Add GitHub secret EXPO_TOKEN from https://expo.dev"
            exit 1
          fi
      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      - name: Write Play service account
        run: |
          if [ -n "${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT }}" ]; then
            echo '${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT }}' > pc-api-key.json
          fi
      - run: npx eas-cli build --platform android --profile production --non-interactive
      - name: Submit Android
        if: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT != '' }}
        run: npx eas-cli submit --platform android --profile production --latest --non-interactive
        continue-on-error: true

  ios:
    name: iOS EAS → App Store
    runs-on: ubuntu-latest
    needs: []
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - name: Require Expo token
        run: |
          if [ -z "${{ secrets.EXPO_TOKEN }}" ]; then
            echo "Add GitHub secret EXPO_TOKEN from https://expo.dev"
            exit 1
          fi
      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      - name: Build iOS
        run: npx eas-cli build --platform ios --profile production --non-interactive
        continue-on-error: true
      - name: Submit iOS
        if: ${{ secrets.EXPO_APPLE_APP_SPECIFIC_PASSWORD != '' }}
        run: npx eas-cli submit --platform ios --profile production --latest --non-interactive
        continue-on-error: true
