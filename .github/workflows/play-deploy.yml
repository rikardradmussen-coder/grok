name: Automated Store Builds

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  android:
    name: Android EAS → Play Internal
    runs-on: ubuntu-latest
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      GOOGLE_PLAY_SERVICE_ACCOUNT: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - name: Require Expo token
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "Add GitHub secret EXPO_TOKEN from https://expo.dev"
            exit 1
          fi
      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      - name: Write Play service account (optional)
        run: |
          if [ -z "$GOOGLE_PLAY_SERVICE_ACCOUNT" ]; then
            echo "GOOGLE_PLAY_SERVICE_ACCOUNT not set — build only, skip submit"
          else
            printf '%s\n' "$GOOGLE_PLAY_SERVICE_ACCOUNT" > pc-api-key.json
          fi
      - run: npx eas-cli build --platform android --profile production --non-interactive
      - name: Submit Android
        run: |
          if [ ! -f pc-api-key.json ]; then
            echo "Skipping Play submit — no service account JSON"
            exit 0
          fi
          npx eas-cli submit --platform android --profile production --latest --non-interactive
        continue-on-error: true

  ios:
    name: iOS EAS → App Store
    runs-on: ubuntu-latest
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      EXPO_APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.EXPO_APPLE_APP_SPECIFIC_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - name: Require Expo token
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "Add GitHub secret EXPO_TOKEN from https://expo.dev"
            exit 1
          fi
      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      - name: Build iOS
        run: npx eas-cli build --platform ios --profile production --non-interactive
        continue-on-error: true
      - name: Submit iOS
        run: |
          if [ -z "$EXPO_APPLE_APP_SPECIFIC_PASSWORD" ]; then
            echo "Skipping iOS submit — EXPO_APPLE_APP_SPECIFIC_PASSWORD not set"
            exit 0
          fi
          npx eas-cli submit --platform ios --profile production --latest --non-interactive
        continue-on-error: true
