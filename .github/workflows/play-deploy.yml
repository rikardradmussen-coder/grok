name: Automated Google Play Deployment

on:
  push:
    branches: [main]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Project Dependencies
        run: npm install

      - name: Setup Expo EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Authenticate with Google Play API
        run: |
          echo '${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT }}' > pc-api-key.json

      - name: Execute Full Automated Build
        run: npx eas build --platform android --profile production --non-interactive

      - name: Submit to Play Internal track
        run: npx eas submit --platform android --profile production --latest --non-interactive
        continue-on-error: true
